name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build package artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Build package
        run: |
          dart pub publish --dry-run && mkdir -p dist && git archive --format=zip -o dist/source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*

  # Publishing is intentionally disabled. Enable the job and add the registry credentials as
  # repository secrets only after PaySafe approves the release.
  publish:
    name: Publish (disabled)
    needs: build
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
      - name: Publish
        run: echo "dart pub publish"
